      <stop offset="0%" stop-color="#1E8A7A"/>
      <stop offset="55%" stop-color="#0F4C45"/>
      <stop offset="100%" stop-color="#0B0F1A"/>
    </radialGradient>
    <linearGradient id="eg-leaf" x1="0" y1="0" x2="1" y2="1">
